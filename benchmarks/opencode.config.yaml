options:
  runCount: 1
  parallel: true
  outputDir: ./results

variantDefaults:
  agent:
    type: opencode
    model: github-copilot/gpt-5.4
    options:
      agent: build
      dangerouslySkipPermissions: true
      variant: high
  setup:
    files:
      requirements.md: |
        Implement a simple REST API server in TypeScript using Node.js built-ins (no frameworks).
        The server should run on port 3000 and handle the following endpoints:
          - GET  /health         -> { status: "ok" }
          - GET  /items          -> returns array of all items
          - POST /items          -> creates a new item (body: { name: string }), returns created item with id
          - GET  /items/:id      -> returns a single item by id, 404 if not found
        Items should be stored in-memory. Include a README with usage instructions.

        Use TypeScript with strict mode enabled. No external HTTP framework dependencies (use Node.js `http` module).
        Items should have at minimum: id (uuid or incremental), name (string), createdAt (ISO string).
        Use the current stable versions for dependencies. Use pnpm as package manager.

variants:
  - name: opencode-default
    query:
      - Implement requirements.md
  - name: opencode-thinking
    agent:
      options:
        thinking: true
        variant: max
    query:
      - Implement requirements.md

measure:
  - type: judge
    provider: opencode
    model: github-copilot/gpt-5.4
    acceptanceCriteria:
      - 'GET /health returns 200 with {"status":"ok"}'
      - GET /items returns an array (initially empty)
      - POST /items creates an item and returns it with a unique id
      - GET /items/:id returns the correct item or 404
      - Code compiles and runs with ts-node or tsx
      - A README.md is present with usage instructions
  - type: shell
    name: Builds?
    command: npm run build
    scoreIfPasses: 10
    scoreIfFails: -10
  - type: shell
    name: pnpm used?
    command: (ls pnpm-lock.yaml && echo ok) || exit 1
    scoreIfPasses: 10
    scoreIfFails: -10
  - type: shell
    name: Latest typescript version?
    command: (pnpm outdated typescript && echo "good") || exit 1
    scoreIfPasses: 10
    scoreIfFails: -10
